// ============================================================================
// EngineLifecycle 配置
// 1) ENGINE_LIFECYCLE_SETTINGS:复用衰减与试车增益参数
// 2) SY_MODULE_TEMPLATE:让 ScrapYard 库存件保存 KEF/Kerbalism 的磨损模块状态
//    (没有 ScrapYard 时 :NEEDS 使其自动失效)
// ============================================================================

ENGINE_LIFECYCLE_SETTINGS
{
    decayPerUse = 0.9        // 每被回收复用一次,额定点火次数/工作时长 ×0.9
    testBonusPerTest = 1.3   // 每次成功试车(非碰撞损坏),该族可靠性 ×1.3
    testBonusCap = 3.0       // 族增益上限 ×3
}

// KEF 的发动机故障模块(磨损:ignitions / operation_duration / broken 等)
SY_MODULE_TEMPLATE:NEEDS[ScrapYard]
{
    name = EngineFailures
    storeIfDefault = true
}

// Kerbalism 本体的 Reliability 模块(非发动机部件,同款磨损字段)
SY_MODULE_TEMPLATE:NEEDS[ScrapYard]
{
    name = Reliability
    storeIfDefault = true
}
